name: Crownfall Godot 4.7.2 Headless CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GODOT_TARGET_VERSION: "4.7.2"

jobs:
  verify-vertical-slice:
    name: Static Integrity & Headless Godot 4.7.2 Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate P0 Pixel-Art Assets if Missing
        run: python3 scripts/tools/generate_pixel_assets.py

      - name: Run Repository Static, Scene-Graph & OD-01..OD-10 Consistency Verifier
        run: python3 tests/verify_repo_integrity.py

      - name: Setup Godot 4.7.2 Headless (Explicit Version Lock — No Silent Fallback)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Enforce Exact Godot 4.7.2 Runtime Version
        run: |
          ACTUAL_VERSION="$(godot --version)"
          echo "Detected Godot version: ${ACTUAL_VERSION}"
          echo "${ACTUAL_VERSION}" | grep -E "^4\.7\.2\."

      - name: Verify Project Import & Parser
        run: |
          set -o pipefail
          godot --headless --import 2>&1 | tee /tmp/godot_import.log
          ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:)" /tmp/godot_import.log

      - name: Run P0 Unit Tests (M2-M7 + Extreme Save Rollback)
        run: |
          set -o pipefail
          godot --headless --script res://tests/test_unit_m2_m7.gd 2>&1 | tee /tmp/godot_unit.log
          ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:)" /tmp/godot_unit.log
          grep -q "PASS: All .* P0 Unit Checks" /tmp/godot_unit.log

      - name: Run P0 Scene Integration Test (M8 Real Scene Transitions & Full Loop)
        run: |
          set -o pipefail
          godot --headless --script res://tests/test_integration_m8_slice.gd 2>&1 | tee /tmp/godot_m8.log
          ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:)" /tmp/godot_m8.log
          grep -q "PASS: All .* M8 Multi-Frame Scene Transition" /tmp/godot_m8.log

      - name: Run Experimental P1 Skeleton Tests (M9-M10)
        run: |
          set -o pipefail
          godot --headless --script res://tests/test_experimental_p1_m9_m10.gd 2>&1 | tee /tmp/godot_p1.log
          ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:)" /tmp/godot_p1.log
          grep -q "PASS: All .* Experimental P1 Skeleton Checks" /tmp/godot_p1.log
