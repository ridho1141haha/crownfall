name: Crownfall Godot 4.7.2 Headless CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GODOT_TARGET_VERSION: "4.7.2"

jobs:
  verify-vertical-slice:
    name: Static Integrity & Full Headless Regression Suite (Godot 4.7.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate P0 Pixel-Art & SFX Assets if Missing
        run: |
          set -euo pipefail
          REQUIRED_ASSETS=(
            "assets/characters/player/player_monarch_sheet.png"
            "assets/characters/npc/npc_builder_sheet.png"
            "assets/enemies/first_enemy/enemy_greedling_raider_sheet.png"
            "assets/buildings/town_center/building_town_center_sheet.png"
            "assets/buildings/wooden_wall/building_wooden_wall_states.png"
            "assets/items/resources/items_resources_sheet.png"
            "assets/environment/terrain/terrain_shore_tile.png"
            "assets/audio/sfx_coin.wav"
            "assets/audio/sfx_build.wav"
            "assets/audio/sfx_hit.wav"
            "assets/audio/sfx_bow.wav"
            "assets/audio/sfx_sunset.wav"
            "assets/audio/sfx_night.wav"
          )
          missing=0
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [ ! -f "${asset}" ]; then
              missing=1
              break
            fi
          done
          if [ "${missing}" -eq 1 ]; then
            echo "Missing P0 asset(s) detected; installing pillow and regenerating..."
            python3 -m pip install --quiet pillow
            python3 scripts/tools/generate_pixel_assets.py
            python3 scripts/tools/generate_sfx_assets.py
          else
            echo "All P0 pixel-art and SFX assets present; skipping regeneration."
          fi

      - name: Cache Godot 4.7.2 Project Import Metadata (Read-Only Assets Only — Never User Saves)
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
            .godot/global_script_class_cache.cfg
          key: godot-4.7.2-import-${{ runner.os }}-${{ hashFiles('project.godot', 'assets/**', 'scenes/**', 'scripts/**') }}
          restore-keys: |
            godot-4.7.2-import-${{ runner.os }}-

      - name: Setup Godot 4.7.2 Headless (Explicit Version Lock — No Silent Fallback)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Enforce Exact Godot 4.7.2 Runtime Version
        run: |
          ACTUAL_VERSION="$(godot --version)"
          echo "Detected Godot version: ${ACTUAL_VERSION}"
          echo "${ACTUAL_VERSION}" | grep -E "^4\.7\.2\."

      - name: Bootstrap Project Class Cache if Missing (Isolated Temp Env)
        run: |
          set -o pipefail
          if [ ! -f ".godot/global_script_class_cache.cfg" ]; then
            TMP_BOOT="$(mktemp -d /tmp/godot_import_boot_XXXXXXXX)"
            trap 'rm -rf -- "${TMP_BOOT}"' EXIT
            HOME="${TMP_BOOT}/home" XDG_DATA_HOME="${TMP_BOOT}/xdg-data" XDG_CACHE_HOME="${TMP_BOOT}/xdg-cache"               godot --headless --import 2>&1 | tee /tmp/godot_bootstrap_import.log
            ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:)" /tmp/godot_bootstrap_import.log
          else
            echo "Godot class cache restored from cache; skipping cold bootstrap import."
          fi

      - name: Run Full Sandboxed Regression Suite (tests/run_all.sh)
        run: |
          set -o pipefail
          bash tests/run_all.sh 2>&1 | tee /tmp/crownfall_run_all.log
          ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:)" /tmp/crownfall_run_all.log
          grep -q "SAVE GUARD OK:" /tmp/crownfall_run_all.log
          grep -q "SUMMARY: passed=[0-9]\+ failed=0 skipped=0" /tmp/crownfall_run_all.log
          grep -q "ALL SUITES PASSED" /tmp/crownfall_run_all.log

      - name: Verify Full Regression Coverage Inventory (Foundational + N4 + N5.0-N5.6 + N6.0 + N6.1)
        run: |
          set -euo pipefail
          EXPECTED_COUNT="$(grep -c '^run_godot ' tests/run_all.sh)"
          grep -q "SUMMARY: passed=${EXPECTED_COUNT} failed=0 skipped=0" /tmp/crownfall_run_all.log
          for marker in             "PASS: runner sandbox gate"             "PASS: test_time_manager"             "PASS: All .* P0 Unit Checks"             "PASS: All .* M8 Multi-Frame Scene Transition"             "PASS: All 10 gameplay scenarios"             "PASS: All .* N50 Chapter I Boundary"             "PASS: All .* N51 First Foothold"             "PASS: All .* N52 First Night Narrative"             "PASS: All .* N53 Scientist Research Narrative"             "PASS: All .* N54 Vessel Readiness Narrative"             "PASS: All .* N55 Eldergrove Handoff"             "PASS: All .* N56 Island Continue"             "PASS: All .* N60 Eldergrove Playable"             "PASS: All .* N61 First Camp Construction" \
            "PASS: All .* N62 Eldergrove Day Cycle" \
            "PASS: All .* N63 First Camp Rest" \
            "PASS: All .* N64 Eldergrove Night Survival" \
            "PASS: All .* N65 Eldergrove Threat Encounters" \
            "PASS: All .* N66 First Camp Active Defense" \
            "PASS: All .* N67 First Camp Integrity & Repair"; do
            grep -q "${marker}" /tmp/crownfall_run_all.log || { echo "MISSING REQUIRED COVERAGE MARKER: ${marker}"; exit 1; }
          done
          echo "COVERAGE GATE OK: all ${EXPECTED_COUNT} sandboxed Godot steps ran with failed=0 skipped=0."

  visual-evidence:
    name: N44B Windowed Visual Evidence (Xvfb, Godot 4.7.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot 4.7.2 Project Import Metadata (Read-Only Assets Only — Never User Saves)
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
            .godot/global_script_class_cache.cfg
          key: godot-4.7.2-import-${{ runner.os }}-${{ hashFiles('project.godot', 'assets/**', 'scenes/**', 'scripts/**') }}
          restore-keys: |
            godot-4.7.2-import-${{ runner.os }}-

      - name: Setup Godot 4.7.2 Headless (Explicit Version Lock — No Silent Fallback)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Enforce Exact Godot 4.7.2 Runtime Version
        run: |
          ACTUAL_VERSION="$(godot --version)"
          echo "Detected Godot version: ${ACTUAL_VERSION}"
          echo "${ACTUAL_VERSION}" | grep -E "^4\.7\.2\."

      - name: Initialize Isolated CI Sandbox (Step 3)
        run: |
          set -euo pipefail
          RUNNER_SANDBOX_BASE="$(mktemp -d /tmp/step3_runner_iso_XXXXXXXX)"
          SANDBOX_CANON="$(readlink -m -- "${RUNNER_SANDBOX_BASE}")"
          if [ "${SANDBOX_CANON}" != "${RUNNER_SANDBOX_BASE}" ]; then
            echo "Sandbox base does not canonicalize to itself: ${RUNNER_SANDBOX_BASE} -> ${SANDBOX_CANON}"
            rm -rf -- "${RUNNER_SANDBOX_BASE}"
            exit 1
          fi
          HOME="${RUNNER_SANDBOX_BASE}/home"
          XDG_DATA_HOME="${RUNNER_SANDBOX_BASE}/xdg-data"
          XDG_CACHE_HOME="${RUNNER_SANDBOX_BASE}/xdg-cache"
          mkdir -p "${HOME}" "${XDG_DATA_HOME}" "${XDG_CACHE_HOME}"
          {
            echo "HOME=${HOME}"
            echo "XDG_DATA_HOME=${XDG_DATA_HOME}"
            echo "XDG_CACHE_HOME=${XDG_CACHE_HOME}"
            echo "RUNNER_SANDBOX_BASE=${RUNNER_SANDBOX_BASE}"
          } >> "${GITHUB_ENV}"

      - name: Verify Project Import & Runner Sandbox Gate
        run: |
          set -o pipefail
          godot --headless --import 2>&1 | tee /tmp/godot_visual_import.log
          ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:)" /tmp/godot_visual_import.log
          godot --headless --script res://tests/test_runner_sandbox_gate.gd 2>&1 | tee /tmp/godot_visual_sandbox_gate.log
          ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:)" /tmp/godot_visual_sandbox_gate.log
          ! grep -q "^SKIP:" /tmp/godot_visual_sandbox_gate.log
          grep -q "PASS: runner sandbox gate" /tmp/godot_visual_sandbox_gate.log

      - name: Run N44B Windowed Visual Pass (Xvfb)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb
          mkdir -p /tmp/crownfall_n44b_visual
          N44B_VISUAL_DIR=/tmp/crownfall_n44b_visual xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-method gl_compatibility --script res://scripts/tools/n44b_visual_pass.gd 2>&1 | tee /tmp/godot_n44b_visual.log
          ! grep -E "(SCRIPT ERROR:|Parser Error:|TEST FAILURE:|N44B VISUAL PASS FAILED)" /tmp/godot_n44b_visual.log
          test "$(find /tmp/crownfall_n44b_visual -maxdepth 1 -name '*.png' | wc -l)" -eq 11

      - name: Upload N44B Visual Evidence
        uses: actions/upload-artifact@v4
        with:
          name: n44b-visual-evidence
          path: /tmp/crownfall_n44b_visual/*.png
          if-no-files-found: error

      - name: Cleanup Isolated CI Sandbox
        if: always()
        run: |
          if [ -z "${RUNNER_SANDBOX_BASE:-}" ]; then
            exit 0
          fi
          case "${RUNNER_SANDBOX_BASE}" in
            /tmp/step3_runner_iso_*)
              SANDBOX_CANON="$(readlink -m -- "${RUNNER_SANDBOX_BASE}" || true)"
              if [ "${SANDBOX_CANON}" = "${RUNNER_SANDBOX_BASE}" ] && [ -d "${RUNNER_SANDBOX_BASE}" ]; then
                rm -rf -- "${RUNNER_SANDBOX_BASE}"
              fi
              ;;
            *)
              echo "Refusing to remove unexpected RUNNER_SANDBOX_BASE: ${RUNNER_SANDBOX_BASE}"
              exit 1
              ;;
          esac
