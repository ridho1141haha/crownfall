name: Crownfall Godot 4.7.2 Headless CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GODOT_TARGET_VERSION: "4.7.2"

jobs:
  verify-vertical-slice:
    name: Static Integrity & Headless Godot Verification (Target 4.7.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Repository Static, Scene-Graph & Balance Integrity Verifier
        run: python3 tests/verify_repo_integrity.py

      - name: Setup Godot Headless (Target 4.7.2 with 4.3+ stable fallback on standard Linux runners)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Verify Project Import & Parser
        run: godot --headless --import

      - name: Run P0 Unit Tests (M2-M7 + Extreme Save Rollback)
        run: godot --headless --script res://tests/test_unit_m2_m7.gd

      - name: Run P0 Scene Integration Test (M8 Main -> ForgottenShore -> Full Loop)
        run: godot --headless --script res://tests/test_integration_m8_slice.gd

      - name: Run Combined P0 Vertical Slice Suite
        run: godot --headless --script res://tests/test_vertical_slice.gd

      - name: Run Experimental P1 Skeleton Tests (M9-M10)
        run: godot --headless --script res://tests/test_experimental_p1_m9_m10.gd
